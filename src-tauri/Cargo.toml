[package]
name = "fiore"
version = "0.1.0"
description = "Fiore desktop pet"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fiore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# scripts/check.ps1 runs clippy with `-D warnings`. These restriction lints
# match docs/conventions.md (no unwrap/expect/panic outside tests).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
