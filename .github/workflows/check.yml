name: check

# Second gate after the local judge. Runs scripts/check.ps1 -Tier full.
# Evals are not run here: the IDE subscription executes them and evals/run.mjs grades them. No API key.
# No secrets are used by this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CI: "true"

jobs:
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, repo is public

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cfg=()
          if [ -f .gitleaks.toml ]; then cfg=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner "${cfg[@]}" .

  check:
    name: check full (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Detect which projects exist so every later step is skipped cleanly
      # until the Tauri / npm projects are scaffolded (check.ps1 also skips them).
      - name: Detect projects
        id: detect
        shell: pwsh
        run: |
          $rust = Test-Path 'src-tauri/Cargo.toml'
          $npm = Test-Path 'package.json'
          $lock = Test-Path 'package-lock.json'
          "rust=$($rust.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "npm=$($npm.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "lock=$($lock.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "rust=$rust npm=$npm lockfile=$lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # scripts/harness/*.mjs need Node >= 20

      - name: Cache npm
        if: steps.detect.outputs.lock == 'true'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Rust toolchain
        if: steps.detect.outputs.rust == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo
        if: steps.detect.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        if: steps.detect.outputs.lock == 'true'
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: check.ps1 -Tier full
        shell: pwsh
        run: ./scripts/check.ps1 -Tier full
