name: Deploy Fiore website

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test platform detection
        run: node --test docs/site/platform.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir -p _site/assets
          cp docs/site/index.html docs/site/styles.css docs/site/app.js docs/site/platform.mjs _site/
          cp docs/site/assets/preview.png _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
